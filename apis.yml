name: Intellimize
description: 'Intellimize was an AI-powered website optimization, personalization, and conversion-rate
  optimization platform (an amplify-partners portfolio company in the ai-ml sector) that let marketing
  teams continuously test and machine-learn the best-performing landing-page and website experience for
  each visitor. It was acquired by Webflow in 2024 and folded into the Webflow Optimize product; the
  entire intellimize.com domain now 301-redirects to webflow.com/feature/optimize. As a standalone brand
  Intellimize no longer operates an independent developer portal, public API, documentation, or SDK
  surface — enrichment therefore found no OpenAPI, packages, well-known documents, MCP server, or
  security/trust program of its own. Only live domain-security posture for the retained intellimize.com
  domain could be probed.'
